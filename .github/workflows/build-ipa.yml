name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NetDemo.xcodeproj \
            -scheme NetDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build \
            -quiet

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/NetDemo.app"
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry NetDemo.ipa Payload

      - name: Verify package
        run: |
          set -euo pipefail
          echo "--- ipa size ---"
          ls -lh out/NetDemo.ipa
          echo "--- ipa contents ---"
          unzip -l out/NetDemo.ipa
          echo "--- binary arch ---"
          lipo -info out/Payload/NetDemo.app/NetDemo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetDemo-ipa
          path: out/NetDemo.ipa
          if-no-files-found: error
