name: AdjustDemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AdjustDemo:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      - path: Config
        buildPhase: resources
    dependencies:
      - framework: Frameworks/AdjustSigSdk.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: AdjustDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.example.adjustsigndemo
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AdjustDemo-Bridging-Header.h
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: NO
        ARCHS: arm64
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  AdjustDemo:
    build:
      targets:
        AdjustDemo: all
    run:
      config: Debug
    archive:
      config: Release

